<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hamfeed — live feed</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div class="filterbar">
    <input type="search" id="q" placeholder="Search history" aria-label="Search history">
    <input type="search" id="sender" placeholder="Callsign" aria-label="Filter by sender callsign">
    <input type="date" id="from" aria-label="From date">
    <input type="date" id="to" aria-label="To date">
    <label><input type="checkbox" id="hidenoise" checked> hide noise</label>
    <button class="apply" id="apply">Search</button>
    <a class="apply" id="export" href="/api/export/training" download>export training</a>
    <button class="paused" id="pause" aria-pressed="false">Pause feed</button>
    <button class="pill-live" id="jumpLive"></button>
  </div>
  <div class="modebar">
    <label>mode <select id="profile" aria-label="Operating profile"></select></label>
    <label id="channelWrap" style="display:none">channel <select id="channel" aria-label="SDR channel"></select></label>
    <label id="tuneWrap" style="display:none">tune <input id="freq" aria-label="Frequency in MHz" inputmode="decimal" size="9" placeholder="145.110"> <select id="demod" aria-label="Demodulation"></select> gain <input id="gain" aria-label="RF gain in dB" inputmode="numeric" size="4" placeholder="20"> <button class="apply" id="tune">tune</button> <span class="correction-err" id="tuneErr"></span></label>
    <button class="apply" id="listen" aria-pressed="false">Listen to radio</button>
    <audio id="liveAudio" preload="none"></audio>
  </div>
  <div id="modeBanner" class="modebanner" style="display:none"></div>
  <div id="feed"></div>
  <div class="more-wrap"><button id="more" style="display:none">load more</button></div>
</div>
<script src="/app.js"></script>
</body>
</html>
