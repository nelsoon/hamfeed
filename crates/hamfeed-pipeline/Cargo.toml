[package]
name = "hamfeed-pipeline"
version.workspace = true
edition.workspace = true

[features]
# Deploy note: prod runs `cargo build --release -p hamfeed-pipeline
# --features capture` (live mic). A build without `capture` starts and
# exits 2 in a restart loop. `voice` needs wespeaker.onnx on the box.
capture = ["hamfeed-source/capture"]
voice = ["hamfeed-speaker/voice"]

[dependencies]
anyhow.workspace = true
uuid.workspace = true
hamfeed-config = { path = "../hamfeed-config" }
hamfeed-source = { path = "../hamfeed-source" }
hamfeed-ingest = { path = "../hamfeed-ingest", features = ["opus"] }
hamfeed-stt = { path = "../hamfeed-stt" }
hamfeed-store = { path = "../hamfeed-store" }
hamfeed-callsign = { path = "../hamfeed-callsign" }
hamfeed-callbook = { path = "../hamfeed-callbook" }
hamfeed-speaker = { path = "../hamfeed-speaker" }
