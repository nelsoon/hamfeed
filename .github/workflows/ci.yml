# hamfeed CI: Rust (cheap -> costly). From the private template
# (projects/example/templates/ci-rust.yml) + audio system deps, whisper
# model cache, and a static-UI check. Chain: fmt -> clippy -> build -> test.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SYSTEM_DEPS: "libasound2-dev libopus-dev cmake"
  MODEL_SIZE: tiny
  MODEL_DIR: models

jobs:
  fmt: # seconds: rustfmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  static: # seconds: feed UI syntax (no browser needed; Rust tests cover serving)
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check crates/hamfeed-web/static/app.js

  clippy: # tens of seconds: lint, needs build info
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Prepare apt cache dir
        run: |
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends $SYSTEM_DEPS
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  build: # minutes: compile (whisper.cpp + sqlite bundled land here)
    needs: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare apt cache dir
        run: |
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends $SYSTEM_DEPS
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-features

  test: # most expensive: unit + integration tests (fixture-backed, no hardware)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare apt cache dir
        run: |
          sudo mkdir -p /var/cache/apt/archives/partial
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends $SYSTEM_DEPS
      - uses: Swatinem/rust-cache@v2
      - name: Restore whisper model cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}
          key: whisper-${{ env.MODEL_SIZE }}-v1
      - name: Fetch whisper model (cache miss)
        run: sh scripts/download-model.sh "${{ env.MODEL_SIZE }}" "${{ env.MODEL_DIR }}"
      - run: cargo test --locked --all-features

  # ai-review: runs only on green code (needs: test). Wire a reviewer action
  # here. Human review stays last via branch protection on main.
